name: Tag release on merge

# Merging a version bump into main releases it. When pubspec.yaml carries a
# version that has no tag yet, and CHANGELOG.md has a finished section for
# it, this tags the merge commit v<version> and starts release.yml on that
# tag, which builds and publishes the APKs exactly as a hand-pushed tag
# would.
#
# Why it starts release.yml itself: a tag pushed with the workflow's own
# GITHUB_TOKEN does not trigger other workflows (GitHub's rule against
# loops). workflow_dispatch is the exception, and release.yml run on a tag
# ref sees ref_type 'tag', so it publishes a full release, not a dry run.
#
# Nothing happens when:
#   - the tag already exists (a merge that did not change the version, or a
#     release someone tagged by hand), or
#   - the changelog heading still says "unreleased" (work in progress
#     merged early). Replace the heading with a dated one to release.
# A version with no changelog section at all fails, as ci.yml would.
on:
  push:
    branches: [main]
    paths:
      - pubspec.yaml
      - CHANGELOG.md

permissions:
  contents: write
  actions: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and start the release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Every tag, so an existing one is seen.
          fetch-depth: 0

      - name: Decide whether this merge is a release
        id: decide
        run: |
          set -euo pipefail
          full="$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//')"
          name="${full%%+*}"
          tag="v$name"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # Asked of the remote as well as the checkout: a tag pushed by hand
          # a moment after the merge is not in the checkout yet.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null \
             || [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "$tag already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          heading="$(grep -m1 "^## v$name" CHANGELOG.md || true)"
          if [ -z "$heading" ]; then
            echo "::error::pubspec.yaml is $name but CHANGELOG.md has no" \
                 "'## v$name' section."
            exit 1
          fi
          case "$heading" in
            *unreleased*)
              echo "::notice::CHANGELOG.md still marks v$name as unreleased;" \
                   "not tagging."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          echo "Releasing $tag from ${GITHUB_SHA::7}: $heading"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Tag the merge commit
        id: tag
        if: steps.decide.outputs.release == 'true'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Vyana ${TAG#v}" "$GITHUB_SHA"
          if git push origin "refs/tags/$TAG"; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The push can lose a race with someone tagging the same merge by
          # hand (v1.1.7 did). Their push already started release.yml, so
          # if the tag is on this commit there is nothing left to do. On
          # any other commit it is a real conflict and fails.
          remote="$(git ls-remote origin "refs/tags/$TAG^{}" "refs/tags/$TAG" \
                    | awk 'NR==1 || /\^\{\}$/ {sha=$1} END {print sha}')"
          if [ "$remote" = "$GITHUB_SHA" ]; then
            echo "::notice::$TAG was pushed by hand on this commit a moment" \
                 "earlier; its push started the release."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::$TAG already exists on ${remote:-an unknown commit}," \
               "not on this merge (${GITHUB_SHA::7})."
          exit 1

      - name: Start the release build
        # Only for a tag this workflow pushed: a hand-pushed tag starts
        # release.yml itself.
        if: steps.decide.outputs.release == 'true' && steps.tag.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "Started release.yml on $TAG."
