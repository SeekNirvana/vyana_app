name: CI

# The checks the release workflow would fail on anyway, run early enough to
# be worth knowing about. Deliberately does not build an APK: the release
# build pulls multi-gigabyte native toolchains and takes long enough that
# running it on every push would cost more than it catches.
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # The release workflow reads both of these and fails if they disagree,
      # which is a bad moment to find out. Checking here means a tag is only
      # ever pushed at a commit that could actually be released.
      - name: Version and changelog agree
        run: |
          set -euo pipefail
          full="$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//')"
          name="${full%%+*}"
          if ! grep -q "^## v$name" CHANGELOG.md; then
            echo "::error::pubspec.yaml is $name but CHANGELOG.md has no" \
                 "'## v$name' section. A tag cut here could not be released."
            exit 1
          fi
          echo "pubspec $name has a changelog entry."
